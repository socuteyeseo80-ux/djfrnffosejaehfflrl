<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 주의사항 — 이상한 점괘집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Noto+Serif+KR:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-deep: #1c1730;
    --ink-mid: #2c2547;
    --violet-1: #241c3f;
    --violet-2: #150f28;
    --gold: #c9a94f;
    --gold-bright: #e3c877;
    --wax: #8c2f39;
    --paper: #f3ead4;
    --paper-shadow: #d8c9a3;
    --star: #f6f1e0;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(201,169,79,0.10), transparent 45%),
      radial-gradient(ellipse at 80% 85%, rgba(140,47,57,0.12), transparent 50%),
      linear-gradient(180deg, var(--violet-2), var(--ink-deep) 45%, var(--violet-1));
    color: var(--star);
    font-family: 'IBM Plex Sans KR', sans-serif;
    overflow-x:hidden;
  }

  .constellations{
    position: fixed; inset:0; pointer-events:none; z-index:0;
  }
  .constellations span{
    position:absolute; width:2px; height:2px; background:var(--gold-bright);
    border-radius:50%; opacity:0.5;
    box-shadow: 0 0 4px 1px rgba(230,200,120,0.5);
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.15; }
    50%{ opacity:0.8; }
  }

  .wrap{
    position:relative; z-index:1;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding: 56px 20px 80px;
  }

  header.hero{
    text-align:center;
    max-width: 560px;
    margin-bottom: 40px;
  }
  .eyebrow-mark{
    display:inline-block;
    width: 34px; height: 34px;
    margin-bottom: 14px;
    opacity: 0.9;
  }
  h1{
    font-family: 'Cormorant Garamond', 'Noto Serif KR', serif;
    font-weight: 600;
    font-style: italic;
    font-size: clamp(34px, 6vw, 52px);
    margin: 0 0 10px;
    color: var(--gold-bright);
    letter-spacing: 0.5px;
  }
  header.hero p{
    font-family: 'Noto Serif KR', serif;
    font-size: 15px;
    line-height: 1.8;
    color: rgba(243,234,212,0.72);
    margin: 0;
  }

  /* ---------- Card (almanac ledger) ---------- */
  .ledger{
    position:relative;
    width: 100%;
    max-width: 480px;
    background: var(--paper);
    color: var(--ink-deep);
    border-radius: 3px;
    padding: 40px 34px 34px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.55),
      0 0 0 1px rgba(201,169,79,0.35);
  }
  .ledger::before{
    content:"";
    position:absolute; inset: 10px;
    border: 1px solid rgba(140,47,57,0.35);
    pointer-events:none;
  }
  .ledger-title{
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 18px;
    text-align:center;
    margin: 0 0 4px;
    color: var(--wax);
  }
  .ledger-sub{
    text-align:center;
    font-size: 12.5px;
    color: rgba(28,23,48,0.55);
    margin: 0 0 26px;
    font-family: 'Noto Serif KR', serif;
  }

  .field{
    margin-bottom: 18px;
  }
  .field label{
    display:block;
    font-family: 'Noto Serif KR', serif;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 7px;
    color: var(--ink-mid);
  }
  .field input{
    width: 100%;
    font-family: 'IBM Plex Sans KR', sans-serif;
    font-size: 15px;
    padding: 11px 13px;
    border: 1px solid var(--paper-shadow);
    background: #fbf6ea;
    border-radius: 2px;
    color: var(--ink-deep);
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .field input:focus{
    border-color: var(--wax);
    box-shadow: 0 0 0 3px rgba(140,47,57,0.12);
  }

  .reveal-btn{
    width: 100%;
    margin-top: 6px;
    padding: 13px 16px;
    font-family: 'Noto Serif KR', serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.5px;
    color: var(--paper);
    background: linear-gradient(180deg, #9d3540, var(--wax));
    border: none;
    border-radius: 2px;
    cursor:pointer;
    position:relative;
    box-shadow: 0 8px 18px -8px rgba(140,47,57,0.6);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .reveal-btn:hover{
    transform: translateY(-1px);
    box-shadow: 0 10px 22px -8px rgba(140,47,57,0.7);
  }
  .reveal-btn:active{
    transform: translateY(0px) scale(0.99);
  }
  .reveal-btn:disabled{
    opacity: 0.55;
    cursor: default;
    transform:none;
  }

  .error-msg{
    font-size: 12.5px;
    color: var(--wax);
    margin-top: 8px;
    min-height: 16px;
    font-family: 'Noto Serif KR', serif;
  }

  /* ---------- Result ---------- */
  .result{
    width: 100%;
    max-width: 480px;
    margin-top: 26px;
    display:none;
  }
  .result.show{ display:block; }

  .result-head{
    text-align:center;
    margin-bottom: 18px;
  }
  .result-head .name-line{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 24px;
    color: var(--gold-bright);
  }
  .result-head .date-line{
    font-size: 12px;
    color: rgba(243,234,212,0.55);
    margin-top: 4px;
    letter-spacing: 0.5px;
  }

  .stat-row{
    display:flex;
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-box{
    flex:1;
    background: rgba(243,234,212,0.06);
    border: 1px solid rgba(201,169,79,0.28);
    border-radius: 3px;
    padding: 12px 10px;
    text-align:center;
    opacity:0;
    transform: translateY(6px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .stat-box.in{ opacity:1; transform:none; }
  .stat-box .stat-label{
    font-size: 11px;
    color: rgba(243,234,212,0.5);
    margin-bottom: 6px;
    font-family: 'Noto Serif KR', serif;
  }
  .stat-box .stat-value{
    font-size: 14.5px;
    font-weight: 600;
    color: var(--gold-bright);
    font-family: 'Noto Serif KR', serif;
  }

  .warn-card{
    background: var(--paper);
    color: var(--ink-deep);
    border-radius: 2px;
    padding: 16px 18px;
    margin-bottom: 10px;
    display:flex;
    gap: 14px;
    align-items:flex-start;
    box-shadow: 0 14px 28px -18px rgba(0,0,0,0.6);
    opacity: 0;
    transform: translateY(10px) rotate(-0.4deg);
    transition: opacity 0.55s ease, transform 0.55s ease;
  }
  .warn-card:nth-child(even){ transform: translateY(10px) rotate(0.4deg); }
  .warn-card.in{ opacity:1; transform: none; }

  .warn-num{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 26px;
    color: var(--wax);
    line-height: 1;
    min-width: 24px;
  }
  .warn-text{
    font-family: 'Noto Serif KR', serif;
    font-size: 14.5px;
    line-height: 1.65;
    padding-top: 2px;
  }

  .advice-box{
    margin-top: 16px;
    padding: 16px 18px;
    border: 1px dashed rgba(201,169,79,0.5);
    border-radius: 3px;
    font-family: 'Noto Serif KR', serif;
    font-size: 13.5px;
    line-height: 1.75;
    color: rgba(243,234,212,0.85);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.55s ease, transform 0.55s ease;
  }
  .advice-box.in{ opacity:1; transform:none; }
  .advice-box b{ color: var(--gold-bright); font-weight:600; }

  .retry-line{
    text-align:center;
    margin-top: 20px;
    font-size: 12px;
    color: rgba(243,234,212,0.4);
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .retry-line.in{ opacity:1; }
  .retry-line button{
    background:none; border:none;
    color: var(--gold-bright);
    text-decoration: underline;
    cursor:pointer;
    font-size: 12px;
    font-family: 'IBM Plex Sans KR', sans-serif;
    padding: 0;
  }

  footer{
    margin-top: 44px;
    font-size: 11px;
    color: rgba(243,234,212,0.3);
    text-align:center;
    max-width: 400px;
    line-height: 1.7;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="constellations" id="stars"></div>

<div class="wrap">
  <header class="hero">
    <svg class="eyebrow-mark" viewBox="0 0 34 34" fill="none">
      <circle cx="17" cy="17" r="15.5" stroke="#c9a94f" stroke-width="1"/>
      <path d="M17 6 L19.2 14.8 L28 17 L19.2 19.2 L17 28 L14.8 19.2 L6 17 L14.8 14.8 Z" fill="#e3c877" opacity="0.85"/>
    </svg>
    <h1>오늘의 주의사항</h1>
    <p>이름과 생일을 적으면, 오늘 하루 유독 조심해야 할 낯설고 사소한 것들을 점괘로 펼쳐드립니다.</p>
  </header>

  <div class="ledger">
    <p class="ledger-title">입 장 부</p>
    <p class="ledger-sub">— 오늘의 점괘를 펼치기 위한 정보 —</p>

    <div class="field">
      <label for="nameInput">이름</label>
      <input type="text" id="nameInput" placeholder="예: 김도윤" maxlength="20">
    </div>
    <div class="field">
      <label for="birthInput">생년월일</label>
      <input type="date" id="birthInput">
    </div>

    <button class="reveal-btn" id="revealBtn">점괘 펼치기</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="result" id="result">
    <div class="result-head">
      <div class="name-line" id="resultName">—</div>
      <div class="date-line" id="resultDate">—</div>
    </div>

    <div class="stat-row">
      <div class="stat-box" id="statColor">
        <div class="stat-label">오늘의 색</div>
        <div class="stat-value" id="colorValue">—</div>
      </div>
      <div class="stat-box" id="statTime">
        <div class="stat-label">주의 시간대</div>
        <div class="stat-value" id="timeValue">—</div>
      </div>
      <div class="stat-box" id="statItem">
        <div class="stat-label">행운의 물건</div>
        <div class="stat-value" id="itemValue">—</div>
      </div>
    </div>

    <div id="warnList"></div>

    <div class="advice-box" id="adviceBox">
      <b>오늘의 한마디.</b> <span id="adviceText"></span>
    </div>

    <div class="retry-line" id="retryLine">
      점괘는 오늘 하루 동안 바뀌지 않습니다 · <button id="retryBtn">다시 펼쳐보기</button>
    </div>
  </div>

  <footer>이 점괘는 순수한 재미를 위한 것으로, 실제 사건과는 무관합니다.<br>오늘 하루도 무탈하게 보내시길.</footer>
</div>

<script>
  // ---------- 배경 별 ----------
  const starLayer = document.getElementById('stars');
  for(let i=0;i<50;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    s.style.animationDelay = (Math.random()*4)+'s';
    starLayer.appendChild(s);
  }

  // ---------- 시드 기반 난수 ----------
  function hashString(str){
    let h = 2166136261;
    for(let i=0;i<str.length;i++){
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function seededPick(rand, arr, count){
    const pool = arr.slice();
    const picked = [];
    for(let i=0;i<count && pool.length>0;i++){
      const idx = Math.floor(rand()*pool.length);
      picked.push(pool[idx]);
      pool.splice(idx,1);
    }
    return picked;
  }
  function seededOne(rand, arr){
    return arr[Math.floor(rand()*arr.length)];
  }

  // ---------- 데이터 풀 ----------

  const COLORS = ["보라", "짙은 초록", "감청색", "먹빛 검정", "황토색", "회색", "짙은 남색", "고동색", "쪽빛", "은회색"];

  const ADVICE = [

    "누군가의 말보다 자신의 직감을 한 번 더 믿어도 좋은 날입니다.",
    "오늘 지나친 것들은 다시 돌아오지 않으니, 잠깐 멈춰서는 여유를 가져보세요.",
    "경고는 세 개지만, 그중 진짜 조심해야 할 것은 마음이 먼저 알아챌 것입니다."
  ];

  // ---------- 상태 ----------
  let lastRand = null;

  function formatDate(d){
    const days = ['일','월','화','수','목','금','토'];
    return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()} (${days[d.getDay()]})`;
  }

  function todayKey(){
    const d = new Date();
    return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
  }

  function runFortune(){
    const nameEl = document.getElementById('nameInput');
    const birthEl = document.getElementById('birthInput');
    const errEl = document.getElementById('errorMsg');
    const name = nameEl.value.trim();
    const birth = birthEl.value;

    if(!name){
      errEl.textContent = '이름을 적어주세요.';
      nameEl.focus();
      return;
    }
    if(!birth){
      errEl.textContent = '생년월일을 선택해주세요.';
      birthEl.focus();
      return;
    }
    errEl.textContent = '';

    const seed = hashString(name + '|' + birth + '|' + todayKey());
    const rand = mulberry32(seed);
    lastRand = rand;

    const picks = seededPick(rand, WARNINGS, 3);
    const color = seededOne(rand, COLORS);
    const time = seededOne(rand, TIMES);
    const item = seededOne(rand, ITEMS);
    const advice = seededOne(rand, ADVICE);

    document.getElementById('resultName').textContent = `${name} 님의 오늘`;
    document.getElementById('resultDate').textContent = formatDate(new Date());
    document.getElementById('colorValue').textContent = color;
    document.getElementById('timeValue').textContent = time;
    document.getElementById('itemValue').textContent = item;
    document.getElementById('adviceText').textContent = advice;

    const warnList = document.getElementById('warnList');
    warnList.innerHTML = '';
    picks.forEach((w, i) => {
      const card = document.createElement('div');
      card.className = 'warn-card';
      card.innerHTML = `<div class="warn-num">${i+1}</div><div class="warn-text">${w}</div>`;
      warnList.appendChild(card);
    });

    const resultEl = document.getElementById('result');
    resultEl.classList.add('show');

    // reset animation states
    document.querySelectorAll('.stat-box, .warn-card, .advice-box, .retry-line').forEach(el => el.classList.remove('in'));

    // staggered reveal
    let delay = 150;
    document.querySelectorAll('.stat-box').forEach((el, i) => {
      setTimeout(() => el.classList.add('in'), delay + i*120);
    });
    delay += 3*120 + 150;
    document.querySelectorAll('.warn-card').forEach((el, i) => {
      setTimeout(() => el.classList.add('in'), delay + i*220);
    });
    delay += 3*220 + 200;
    setTimeout(() => document.getElementById('adviceBox').classList.add('in'), delay);
    delay += 300;
    setTimeout(() => document.getElementById('retryLine').classList.add('in'), delay);

    resultEl.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }

  document.getElementById('revealBtn').addEventListener('click', runFortune);
  document.getElementById('retryBtn').addEventListener('click', () => {
    document.getElementById('warnList').innerHTML = '';
    runFortune();
  });
  document.getElementById('nameInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') runFortune();
  });
</script>

</body>
</html>
